# One shared policy; one independent Piper per environment. Headless state observations.
seed: 7
environment:
  ctrl_dt: 0.05
  sim_dt: 0.005
  impl: warp
  solver_iterations: 8
  solver_ls_iterations: 4
training:
  num_timesteps: 16777216
  num_envs: 1024
  episode_length: 100
  unroll_length: 16
  batch_size: 256
  num_minibatches: 4
  num_updates_per_batch: 4
  num_evals: 5
  num_eval_envs: 64
  learning_rate: 0.0003
  discounting: 0.99
  gae_lambda: 0.95
  entropy_cost: 0.001
  clipping_epsilon: 0.2
  reward_scaling: 1.0
  normalize_observations: true
  max_grad_norm: 1.0
  action_repeat: 1
  bootstrap_on_timeout: false
  deterministic_eval: true
network:
  policy_hidden_layer_sizes: [128, 128]
  value_hidden_layer_sizes: [128, 128]
  policy_obs_key: state
  value_obs_key: state

